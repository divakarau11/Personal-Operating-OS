<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123e48"><meta name="description" content="A calm personal operating system for meaningful priorities, daily practice and reflection.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>North Star — Personal Operating System</title>
<style>
:root{--ink:#17373b;--muted:#637b78;--sea:#123e48;--teal:#397c78;--leaf:#55785c;--sand:#d6b982;--cream:#f5f3eb;--paper:#fffef9;--line:#dce3da;--soft:#e7efea;--blue:#e4eef0;--rose:#f4e8df;--shadow:0 10px 30px #123e4810}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #91bdb5;outline-offset:2px}
.app{max-width:1180px;margin:auto;padding:0 20px 40px}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0;gap:12px}.brand{display:flex;gap:10px;align-items:center;font-weight:750;letter-spacing:.2px}.mark{width:38px;height:38px;border-radius:12px;background:var(--sea);display:grid;place-items:center;color:#f7f3e7;font-size:20px}.top small{color:var(--muted)}.nav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:12px;font-weight:650}.nav button.active,.nav button:hover{background:var(--sea);color:white}
main{padding-top:20px}.hero{border-radius:24px;padding:30px;color:#fff;background:linear-gradient(115deg,#123e48f5,#275f5aeb),url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1800&q=80') center/cover;box-shadow:var(--shadow);min-height:200px;display:flex;flex-direction:column;justify-content:center}.eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-size:11px;font-weight:800;opacity:.8}.hero h1{font-size:clamp(27px,4vw,40px);line-height:1.12;margin:8px 0 10px;max-width:700px}.hero p{max-width:720px;margin:0;color:#e5efeb}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(270px,.7fr);gap:18px;margin-top:18px}.stack{display:grid;gap:16px;align-content:start}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.card h2{font-size:19px;margin:0 0 5px}.card h3{font-size:15px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.sectionhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.pill{display:inline-flex;align-items:center;background:var(--soft);color:#315f4b;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750}.btn{border:0;background:var(--sea);color:white;border-radius:11px;padding:10px 14px;font-weight:700}.btn:hover{background:#235760}.btn.secondary{background:var(--soft);color:var(--ink)}.btn.ghost{background:transparent;color:var(--sea);border:1px solid var(--line)}.btn.danger{background:#8a423b}.btn.smallbtn{padding:6px 9px;font-size:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:12px;font-weight:750;color:var(--muted)}input,textarea,select{width:100%;border:1px solid #cfdad3;border-radius:10px;padding:10px 11px;background:#fffefb;color:var(--ink)}textarea{min-height:90px;resize:vertical}.checkrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #edf0e9}.checkrow:last-child{border-bottom:0}.checkrow input{width:18px;height:18px;margin-top:3px;accent-color:var(--leaf)}.checkrow strong{display:block}.checkrow span{font-size:12px;color:var(--muted)}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:13px;background:#f0f4ee;border-radius:12px}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.item{border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0;background:#fffefb}.item p{margin:5px 0;color:var(--muted);font-size:13px}.item .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:transparent;padding:8px 11px;border-radius:10px;color:var(--muted)}.tabs button.active{background:var(--blue);color:var(--sea);border-color:#bdd1d1}.notice{background:#f7f0df;border:1px solid #e9d9b6;border-radius:12px;padding:12px;color:#67532d;font-size:13px}.empty{padding:24px;text-align:center;color:var(--muted)}.progress{height:7px;background:#e5ebe4;border-radius:99px;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:var(--teal);width:0}.question{font-weight:750;margin-bottom:7px}.footer{padding:26px 0;color:var(--muted);font-size:12px;text-align:center}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#0c282bb3;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:var(--paper);border-radius:20px;padding:22px;max-width:700px;width:100%;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--sea);color:white;padding:10px 16px;border-radius:12px;z-index:9;box-shadow:var(--shadow)}.tag{font-size:11px;padding:4px 7px;border-radius:7px;background:#eef0e9;color:#486050}.reflectionprompt{font-family:Georgia,serif;font-size:22px;line-height:1.35;color:#254e50}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}
@media(max-width:760px){.app{padding:0 13px 28px}.top{align-items:flex-start}.top small{display:none}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.nav button{padding:9px 4px;font-size:12px}.layout{grid-template-columns:1fr}.hero{padding:23px;min-height:180px}.card{padding:16px}.statgrid{grid-template-columns:repeat(3,1fr)}.stat strong{font-size:18px}}

/* Compact goal comparison */
.goal-table-wrap{width:100%;overflow-x:hidden}
.goal-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.goal-table th,.goal-table td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left;overflow-wrap:anywhere}
.goal-table th{font-size:12px;color:var(--ink)}
.goal-table th:nth-child(1){width:21%}
.goal-table th:nth-child(2),.goal-table th:nth-child(3),.goal-table th:nth-child(4),.goal-table th:nth-child(5){width:10%}
.goal-table th:nth-child(6){width:6%}
.goal-table th:nth-child(7){width:13%}
.goal-table th:nth-child(8){width:10%}
.criterion-question{display:block;font-size:10px;line-height:1.3;color:var(--muted);font-weight:400;margin-top:5px}
.goal-table .goaldesc{margin-top:4px;line-height:1.35}
.goal-table .scorecell select{width:100%;min-width:0;padding:7px 2px;font-size:12px}
.goal-table .totalcell{white-space:nowrap}
.goal-table .totalcell strong{font-size:14px}
.goal-table .totalcell .muted{font-size:10px;margin-left:2px}
.goal-table .actioncell .actions{display:flex;flex-direction:column;gap:4px}
.goal-table .actioncell button{padding:6px 7px;font-size:11px;white-space:normal}
@media(max-width:850px){.goal-table-wrap{overflow-x:auto}.goal-table{min-width:850px}.goal-table th,.goal-table td{padding:8px 5px}}
/* Quiet visual hierarchy and idea garden */
.eyebrow:before{content:'✦ ';color:var(--sand)}
.idea-mark{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--sea);font-size:19px;margin-right:8px}
.idea-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.idea-row:last-child{border-bottom:0}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="mark">✦</div><div>North Star<div class="muted small" style="font-weight:500">A personal operating system</div></div></div><small id="todayLabel"></small></header>
<nav class="nav" id="nav"></nav><main id="main"></main><div class="footer">Make room for the life you actually want. · Your entries stay in this browser unless you export them.</div></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='northstar-v1';
const defaultVision='Build financial freedom so I can choose how I spend my time, live closer to nature, continue my inner growth, and contribute through teaching, organic farming, community and service.';
const seedGoals=[
['Career leadership','Progress toward Associate Director, Director or CDO-level leadership in clinical data, RBQM, central monitoring and analytics.','Career & capability'],
['Clinical AI and analytics','Build practical AI/ML, Python/R, analytics and AI governance capabilities through hands-on projects.','Career & capability'],
['Financial freedom','Build assets and income options to increase choice and time freedom.','Financial freedom'],
['Low-risk business experiments','Validate a side business without risking job, savings or life stability.','Financial freedom'],
['Teaching and education','Explore visiting faculty work, clinical research education, mentoring and educational content.','Teaching & service'],
['Organic farming and permaculture','Develop practical skills and eventually create a sustainable growing environment and relationship with land.','Nature & community'],
['Community and service','Contribute to community, environmental work and practical service.','Teaching & service'],
['Spiritual growth','Maintain chosen daily meditation and Isha practices.','Inner growth & health'],
['Health and energy','Build sustainable movement, sleep, nutrition and health basics.','Inner growth & health'],
['Clinical Data Connect','Create useful clinical research educational content selectively, without pressure to post constantly.','Teaching & service'],
['Reading and learning','Use books and focused courses to solve real problems, rather than making consumption the default.','Career & capability'],
['Strategy learning','Understand and apply strategy to real choices and projects.','Career & capability']
].map((g,i)=>({id:'g'+i,title:g[0],description:g[1],category:g[2],status:'incubate',assessment:{},created:new Date().toISOString()}));
const questions=[
['Would I still pursue this if nobody noticed or praised me?','Meaning'],
['What am I consciously choosing not to do if I pursue this?','Trade-off'],
['What tangible result can I achieve in the next 8–12 weeks?','Finish line']
];
const scoreCriteria=[
['impact','Impact','How much would achieving this improve my life?'],
['compounding','Compounding','Will the benefits grow over time?'],
['urgency','Urgency','What will it cost me to delay this by a year?'],
['feasibility','Feasibility','Can I make meaningful progress with my current resources?']
];
function scoreTotal(g){return scoreCriteria.reduce((sum,c)=>sum+(Number(g.scores?.[c[0]])||0),0)}

const reflections=[
['Alignment','Did the way I spend my time today move me towards the life I want, or towards a life I am simply accustomed to?'],
['Meaning','What moment today felt genuinely worthwhile, even if it produced no measurable result?'],
['Avoidance','What important thing did I postpone, and what was I protecting myself from?'],
['Freedom','Did I make a decision today that increases my future freedom, or creates another obligation?'],
['Service','Did I contribute something useful to another person or to the world around me?'],
['Inner life','Was there a moment when I was fully present, rather than chasing the next thing?'],
['Learning','What did I discover by doing something today that I would not have learned by consuming more information?'],
['Enough','What am I pursuing because I genuinely value it, and what am I pursuing because I feel behind?']
];
const habits=["Baba's meditation","Isha Hatha Yoga / kriya","Dr Joe Dispenza meditation","Basic health and personal care"];
const defaultHabitDescriptions=['Flexible duration; consistency without guilt','Flexible duration; consistency without guilt','Flexible duration; consistency without guilt','Care for your energy and body'];
const today=()=>new Date().toLocaleDateString('en-CA');
function fresh(){return {vision:defaultVision,habits,goals:seedGoals,activePrimary:null,activeSecondary:null,projects:[],daily:{},reflections:{},reviews:{weekly:{},monthly:{},quarterly:{}},ideas:[],settings:{capacity:2,lastBackup:null},habitDescriptions:[...defaultHabitDescriptions]}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Math.random().toString(36).slice(2,10)}
function toast(s){let e=document.getElementById('toastRoot');e.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>e.innerHTML='',2400)}
function dateNice(d=today()){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
let page='Today',goalFilter='All',reflectionDate=today(),reviewType='weekly',assessId=null,assessStep=0;
const navItems=['Today','Goals & Priorities','12-Week Focus','Evening Reflection','Reviews','Idea Garden','Settings & Backup'];
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${n}</button>`).join('')}
function go(p){page=p;renderNav();render()}
function header(title,sub=''){return `<div class="sectionhead"><div><h2>${title}</h2>${sub?`<div class="muted small">${sub}</div>`:''}</div></div>`}
function card(content){return `<section class="card">${content}</section>`}
function button(label,fn,cls='btn'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function getDay(){if(!state.daily[today()])state.daily[today()]={habits:{},oneThing:'',oneDone:false,learning:{obstacle:'',resource:'',application:''},note:''};return state.daily[today()]}
function activeGoals(){return [state.activePrimary,state.activeSecondary].filter(Boolean).map(x=>state.goals.find(g=>g.id===x)).filter(Boolean)}
function render(){document.getElementById('todayLabel').textContent=dateNice();const root=document.getElementById('main');({Today:renderToday,'Goals & Priorities':renderGoals,'12-Week Focus':renderFocus,'Evening Reflection':renderReflection,Reviews:renderReviews,'Idea Garden':renderIdeas,'Settings & Backup':renderSettings}[page]||renderToday)(root)}
function renderToday(root){
 const d=getDay(),completed=habits.filter(h=>d.habits[h]).length,primary=state.goals.find(g=>g.id===state.activePrimary),secondary=state.goals.find(g=>g.id===state.activeSecondary);
 root.innerHTML=`<section class="hero"><div class="eyebrow">Your direction, not your to-do list</div><h1>Build a life that feels like yours.</h1><p>${esc(state.vision)}</p></section>
 <div class="layout"><div class="stack">${card(`${header('Daily foundations','Keep these separate from project productivity.') }<div class="progress"><span style="width:${completed/4*100}%"></span></div>${habits.map((h,i)=>`<label class="checkrow"><input type="checkbox" ${d.habits[h]?'checked':''} onchange="setHabit('${esc(h)}',this.checked)"><div style="flex:1"><strong>${esc(h)}</strong><span>${esc(state.habitDescriptions[i]||'')}</span></div><input aria-label="Minutes for ${esc(h)}" type="number" min="0" placeholder="min" style="max-width:70px;padding:6px" value="${d.habits[h+'_minutes']||''}" onchange="setMinutes('${esc(h)}',this.value)"></label>`).join('')}<div class="muted small" style="margin-top:8px">${completed} of 4 marked today. A missed practice is information, not a verdict.</div>`)}
 ${card(`${header("Today's ONE Thing",primary?'Primary focus: '+esc(primary.title):'Choose a primary project in Goals & Priorities.') }<div class="field"><label>One tangible output or action</label><textarea id="oneThing" placeholder="Example: build and test one working feature, not watch three tutorials.">${esc(d.oneThing)}</textarea></div><label class="checkrow"><input type="checkbox" ${d.oneDone?'checked':''} onchange="getDay().oneDone=this.checked;persist()"><div><strong>Completed</strong><span>Focus on the outcome, not the hours spent.</span></div></label><div class="row" style="margin-top:10px">${button('Save today’s focus',"saveOne()")}${button('Open 12-week plan',"go('12-Week Focus')",'btn secondary')}</div>`)}
 ${card(`${header('Build-first learning loop','Use learning to unblock action, not to postpone it.') }<div class="field"><label>1 · What specific obstacle did I hit?</label><input id="obstacle" value="${esc(d.learning.obstacle)}" placeholder="Name the exact thing stopping progress"></div><div class="field"><label>2 · What resource will answer that question?</label><input id="resource" value="${esc(d.learning.resource)}" placeholder="One targeted video, course section or reference"></div><div class="field"><label>3 · How will I apply it?</label><input id="application" value="${esc(d.learning.application)}" placeholder="The next change I will make or test"></div>${button('Save learning loop','saveLearning()')}`)}
 </div><div class="stack">${card(`${header('Active commitments')}<div class="item"><span class="pill">PRIMARY</span><h3>${primary?esc(primary.title):'No primary project selected'}</h3><p>${primary?esc(primary.description):'Assess your options, then choose deliberately.'}</p>${button(primary?'Review goal':'Assess goals',"go('Goals & Priorities')",'btn secondary')}</div><div class="item"><span class="pill">SECONDARY</span><h3>${secondary?esc(secondary.title):'Optional — not required'}</h3><p>${secondary?'Keep its scope small and capacity realistic.':'You can succeed with one active project.'}</p></div><div class="notice">Adding a project means deciding what gets paused. Your future is not improved by keeping every possibility active.</div>`)}
 ${card(`${header('A pause for the bigger picture')}<p class="muted">Financial freedom is a means to choice: nature, inner growth, teaching, community and service.</p><div class="row" style="flex-wrap:wrap">${button('Evening reflection',"go('Evening Reflection')",'btn')}${button('Capture an opportunity','openGoalModal()','btn secondary')}</div>`)}
 ${card(`${header('This quarter at a glance')}<div class="statgrid"><div class="stat"><strong>${activeGoals().length}/2</strong><span>Active projects</span></div><div class="stat"><strong>${Object.keys(state.reflections).length}</strong><span>Reflections saved</span></div><div class="stat"><strong>${state.goals.filter(g=>g.status==='incubate').length}</strong><span>Ideas parked</span></div></div>`)}
 </div></div>`;
}
function setHabit(h,v){getDay().habits[h]=v;persist();render()}
function setMinutes(h,v){getDay().habits[h+'_minutes']=v;persist()}
function saveOne(){getDay().oneThing=document.getElementById('oneThing').value;persist();toast('Today’s focus saved')}
function saveLearning(){getDay().learning={obstacle:document.getElementById('obstacle').value,resource:document.getElementById('resource').value,application:document.getElementById('application').value};persist();toast('Learning loop saved')}
function renderGoals(root){
 const cats=['All',...new Set(state.goals.map(g=>g.category))];
 const visibleGoals=state.goals.filter(g=>(goalFilter==='All'||g.category===goalFilter)&&g.status!=='archived').sort((a,b)=>scoreTotal(b)-scoreTotal(a));
 const decisionLabel=g=>({now:'DO NOW',active:'FOCUS THIS QUARTER',later:'NEXT QUARTER / LATER',incubate:'DROP / INCUBATE'})[g.assessment?.decision]||'Not decided';
 const tableRows=visibleGoals.map(g=>`<tr>
 <td class="goalcell"><strong>${esc(g.title)}</strong><div class="muted small">${esc(g.category)}</div><div class="small goaldesc">${esc(g.description)}</div></td>
 ${scoreCriteria.map(c=>`<td class="scorecell"><select aria-label="${esc(c[1])} score for ${esc(g.title)}" onchange="setGoalScore('${g.id}','${c[0]}',this.value)"><option value="">—</option>${Array.from({length:10},(_,i)=>i+1).map(n=>`<option value="${n}" ${Number(g.scores?.[c[0]])===n?'selected':''}>${n}</option>`).join('')}</select></td>`).join('')}
 <td class="totalcell"><strong>${scoreTotal(g)}<span class="muted">/40</span></strong></td>
 <td class="decisioncell"><strong>${decisionLabel(g)}</strong><div class="small muted">${esc(g.assessment?.nextAction||'Next action not set')}</div></td>
 <td class="actioncell"><div class="actions">${button('Review',`startAssess('${g.id}')`,'btn smallbtn')}${button('Edit',`editGoal('${g.id}')`,'btn secondary smallbtn')}</div></td>
 </tr>`).join('')||'<tr><td colspan="8">No goals in this category.</td></tr>';
 const projectOptions=state.goals.filter(g=>g.status!=='archived').map(g=>`<option value="${g.id}" ${state.activePrimary===g.id?'selected':''}>${esc(g.title)}</option>`).join('');
 const secondaryOptions=state.goals.filter(g=>g.status!=='archived').map(g=>`<option value="${g.id}" ${state.activeSecondary===g.id?'selected':''}>${esc(g.title)}</option>`).join('');
 root.innerHTML=`<section class="hero"><div class="eyebrow">One simple sequence</div><h1>List everything. Assess honestly. Choose a few. Then act.</h1><p>Score all goals quickly, pressure-test only the strongest candidates, then choose your 12-week focus.</p></section>
 <section class="card"><div class="cardhead"><h2>How to score</h2></div><p class="muted">Score each criterion from 1 (low) to 10 (high). The total helps compare goals; it does not make the decision for you. Sort order updates automatically.</p><div class="layout" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">${scoreCriteria.map(c=>`<div class="item"><strong>${esc(c[1])}</strong><p>${esc(c[2])}</p></div>`).join('')}</div></section>
 <section class="card"><div class="cardhead"><h2>All goals and assessments</h2><span class="muted">${visibleGoals.length} shown · ${state.goals.filter(g=>g.assessment?.decision&&g.status!=='archived').length} decisions saved</span></div><div class="tabs">${cats.map(c=>`<button class="${goalFilter===c?'active':''}" onclick="goalFilter='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div><div class="goal-table-wrap"><table class="goal-table"><thead><tr><th>Goal</th>${scoreCriteria.map(c=>`<th><strong>${esc(c[1])}</strong><span class="criterion-question">${esc(c[2])}</span></th>`).join('')}<th>Total</th><th>Decision</th><th>Action</th></tr></thead><tbody>${tableRows}</tbody></table></div><div style="margin-top:14px">${button('+ Add a goal','openGoalModal()','btn secondary')}</div></section>
 <div class="layout"><div class="stack"><section class="card"><div class="cardhead"><h2>Choose this quarter’s focus</h2></div><p class="muted">Choose one primary project. A secondary is optional. Daily spiritual practices and health foundations stay separate.</p><div class="field"><label>Primary project</label><select id="primarySelect" onchange="setActive('primary',this.value)"><option value="">— Choose after assessment —</option>${projectOptions}</select></div><div class="field"><label>Secondary project (optional)</label><select id="secondarySelect" onchange="setActive('secondary',this.value)"><option value="">— None —</option>${secondaryOptions}</select></div><div class="notice">Before activating another project, write down what you will pause, reduce or postpone.</div>${button('Build the 12-week plan',"go('12-Week Focus')")}</section></div><div class="stack"><section class="card"><div class="cardhead"><h2>Decision guide</h2></div><div class="item"><strong>DO NOW</strong><p>Essential foundations, urgent responsibilities, or a small useful next action.</p></div><div class="item"><strong>FOCUS THIS QUARTER</strong><p>The one project that creates the most meaningful progress in 12 weeks.</p></div><div class="item"><strong>NEXT QUARTER / LATER</strong><p>Worth doing, but not the right use of capacity now.</p></div><div class="item"><strong>DROP / INCUBATE</strong><p>Not aligned enough, not feasible now, or not yet worth committing to.</p></div></section></div></div>`;
}
function setGoalScore(gid,key,value){const g=state.goals.find(x=>x.id===gid);if(!g)return;g.scores=g.scores||{};if(value==='')delete g.scores[key];else g.scores[key]=Number(value);persist();render()}
function setActive(which,val){if(which==='primary'){if(val===state.activeSecondary)state.activeSecondary=null;state.activePrimary=val||null}else{if(val===state.activePrimary)state.activePrimary=null;state.activeSecondary=val||null}if(val){let g=state.goals.find(x=>x.id===val);if(g)g.status='active'}persist();render();if(activeGoals().length>2)toast('Capacity exceeded: keep projects to one primary and one optional secondary.')}
function startAssess(gid){assessId=gid;assessStep=0;showAssessment()}
function showAssessment(){const g=state.goals.find(x=>x.id===assessId);if(!g)return;const a=g.assessment||{};const q=questions[assessStep];const answers=a.pressureTest||{};document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><span class="pill">GOAL PRESSURE-TEST</span><button class="btn ghost smallbtn" onclick="closeModal()">Close</button></div><h2>${esc(g.title)}</h2><p class="muted small">Only three questions, after comparing scores across all goals.</p><div class="progress"><span style="width:${(assessStep+1)/questions.length*100}%"></span></div><div class="muted small">Question ${assessStep+1} of ${questions.length} · ${q[1]}</div><div class="question" style="font-size:20px;margin-top:18px">${esc(q[0])}</div><textarea id="answer" placeholder="A few honest lines are enough.">${esc(answers[assessStep]||'')}</textarea><div class="row between" style="margin-top:16px">${button('Previous',`assessmentMove(-1)`,'btn secondary')}${button(assessStep===questions.length-1?'Choose decision':'Save & next','assessmentMove(1)')}</div><p class="muted small">Answers save as you move between questions.</p></div></div>`}
function assessmentMove(dir){let g=state.goals.find(x=>x.id===assessId);g.assessment=g.assessment||{};g.assessment.pressureTest=g.assessment.pressureTest||{};g.assessment.pressureTest[assessStep]=document.getElementById('answer').value;persist();if(dir>0&&assessStep===questions.length-1){showDecision();return}assessStep=Math.max(0,Math.min(questions.length-1,assessStep+dir));showAssessment()}
function assessmentSkip(){assessmentMove(1)}
function showDecision(){const g=state.goals.find(x=>x.id===assessId),a=g.assessment||{};document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><h2>Choose the role this goal should play</h2><p class="muted">Use scores and answers as evidence, not as an automatic verdict.</p><div class="field"><label>Decision</label><select id="decision"><option value="now" ${a.decision==='now'?'selected':''}>DO NOW</option><option value="active" ${a.decision==='active'?'selected':''}>FOCUS THIS QUARTER</option><option value="later" ${a.decision==='later'?'selected':''}>NEXT QUARTER / LATER</option><option value="incubate" ${a.decision==='incubate'?'selected':''}>DROP / INCUBATE</option></select></div><div class="field"><label>Why this decision?</label><textarea id="rationale" placeholder="What matters, what is realistic, and what is the opportunity cost?">${esc(a.rationale||'')}</textarea></div><div class="field"><label>What will you pause, reduce or not do?</label><textarea id="pause" placeholder="Make the trade-off explicit">${esc(a.pause||'')}</textarea></div><div class="field"><label>Smallest useful action in 48 hours</label><input id="nextAction" value="${esc(a.nextAction||'')}"></div><div class="row between">${button('Back to questions','showAssessment()','btn secondary')}${button('Save decision','saveDecision()')}</div></div></div>`}
function saveDecision(){const g=state.goals.find(x=>x.id===assessId),a=g.assessment;a.rationale=document.getElementById('rationale').value;a.pause=document.getElementById('pause').value;a.nextAction=document.getElementById('nextAction').value;const d=document.getElementById('decision').value;g.status=d==='active'?'active':d==='later'?'later':d==='now'?'now':'incubate';a.decision=d;persist();closeModal();render();toast('Assessment saved')}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openGoalModal(gid=null){const g=gid?state.goals.find(x=>x.id===gid):null;document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>${g?'Edit goal':'Add a goal or opportunity'}</h2><button class="btn ghost smallbtn" onclick="closeModal()">Close</button></div><div class="field"><label>Goal / opportunity</label><input id="goalTitle" value="${esc(g?.title||'')}" placeholder="What are you considering?"></div><div class="field"><label>What does it involve?</label><textarea id="goalDesc" placeholder="Describe the outcome, not only the activity.">${esc(g?.description||'')}</textarea></div><div class="field"><label>Life area</label><select id="goalCat">${['Career & capability','Financial freedom','Teaching & service','Nature & community','Inner growth & health','Creative work','Other'].map(c=>`<option ${g?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="row between">${button('Cancel','closeModal()','btn secondary')}${button('Save goal',`saveGoal('${g?.id||''}')`)}</div></div></div>`}
function saveGoal(gid){const title=document.getElementById('goalTitle').value.trim();if(!title){toast('Add a title first');return}const obj={title,description:document.getElementById('goalDesc').value,category:document.getElementById('goalCat').value};if(gid){Object.assign(state.goals.find(g=>g.id===gid),obj)}else state.goals.push({id:id(),...obj,status:'incubate',assessment:{},created:new Date().toISOString()});persist();closeModal();render();toast('Goal saved')}
function editGoal(gid){openGoalModal(gid)}
function statusGoal(gid){const g=state.goals.find(x=>x.id===gid);const s=prompt('Set status: now, active, later, incubate, or archived',g.status);if(s&&['now','active','later','incubate','archived'].includes(s)){g.status=s;persist();render()}}
function archiveGoal(gid){if(!confirm('Archive this goal? It will remain in your data but leave the active list.'))return;const g=state.goals.find(x=>x.id===gid);g.status='archived';if(state.activePrimary===gid)state.activePrimary=null;if(state.activeSecondary===gid)state.activeSecondary=null;persist();render()}
function renderFocus(root){const p=state.projects.find(x=>x.id===state.activePrimary)||makeProject(state.activePrimary),s=state.projects.find(x=>x.id===state.activeSecondary)||makeProject(state.activeSecondary);const renderP=(x,label)=>{if(!x)return `<div class="item"><h3>${label}</h3><p class="muted">Choose a goal in Goals & Priorities to create a plan.</p></div>`;return `<div class="item"><span class="pill">${label}</span><h3>${esc(state.goals.find(g=>g.id===x.goalId)?.title||'Project')}</h3><div class="field"><label>Why this matters</label><textarea id="${x.id}-why">${esc(x.why)}</textarea></div><div class="field"><label>12-week outcome / definition of done</label><textarea id="${x.id}-done">${esc(x.done)}</textarea></div><div class="field"><label>Hours per week</label><input type="number" id="${x.id}-hours" min="0" max="80" value="${esc(x.hours||'')}"></div><div class="field"><label>What I am deliberately not doing</label><textarea id="${x.id}-pause">${esc(x.pause)}</textarea></div><div class="field"><label>Next concrete action</label><input id="${x.id}-next" value="${esc(x.next)}"></div><div class="field"><label>Weekly milestones (one per line)</label><textarea id="${x.id}-milestones" placeholder="Week 1: ...">${esc((x.milestones||[]).join('\\n'))}</textarea></div>${button('Save plan',`saveProject('${x.id}')`)}</div>`};root.innerHTML=`<section class="hero"><div class="eyebrow">Twelve weeks of deliberate focus</div><h1>Less switching. More finished work.</h1><p>Define the result, the trade-offs, and the next action. Learning supports the work; it does not replace it.</p></section><div class="layout"><div class="stack">${card(`${header('12-week plan','Week 1 begins when you decide to start; this is your planning canvas.')}${renderP(p,'PRIMARY')}${renderP(s,'SECONDARY')}`)}</div><div class="stack">${card(`${header('The weekly ONE Thing')}<p class="muted">What is the highest-leverage action this week? Pick one milestone and make it concrete.</p><div class="field"><label>Weekly ONE Thing</label><textarea id="weeklyOne" placeholder="The single action that makes the most progress">${esc(state.weeklyOne||'')}</textarea></div>${button('Save weekly focus',"state.weeklyOne=document.getElementById('weeklyOne').value;persist();toast('Weekly focus saved')")}`)}${card(`${header('Build before browsing')}<p>When stuck, write the obstacle first. Find one targeted resource. Apply it immediately. Record the change or test.</p><div class="notice">Do not add a course unless it solves a current obstacle or is necessary for the defined 12-week outcome.</div>`)}</div></div>`}
function makeProject(gid){if(!gid)return null;let p=state.projects.find(x=>x.goalId===gid);if(!p){p={id:'p'+gid,goalId:gid,why:'',done:'',hours:'',pause:'',next:'',milestones:[]};state.projects.push(p);persist()}return p}
function saveProject(pid){const p=state.projects.find(x=>x.id===pid);if(!p)return;p.why=document.getElementById(pid+'-why').value;p.done=document.getElementById(pid+'-done').value;p.hours=document.getElementById(pid+'-hours').value;p.pause=document.getElementById(pid+'-pause').value;p.next=document.getElementById(pid+'-next').value;p.milestones=document.getElementById(pid+'-milestones').value.split('\n').filter(Boolean);persist();toast('12-week plan saved')}
function renderReflection(root){let entry=state.reflections[reflectionDate]||{text:'',extra:'',promptIndex:Math.floor((new Date(reflectionDate+'T12:00:00').getDate()-1)%reflections.length)};const idx=entry.promptIndex??0;root.innerHTML=`<section class="hero"><div class="eyebrow">Close the day with honesty, not a score</div><h1>Notice what your life is teaching you.</h1><p>A few thoughtful minutes are enough. You do not need to turn reflection into another performance measure.</p></section><div class="layout"><div class="stack">${card(`${header('Evening reflection','One meaningful question. About three minutes.') }<div class="field"><label>Date</label><input type="date" id="reflectionDate" value="${reflectionDate}" onchange="reflectionDate=this.value;render()"></div><div class="field"><label>Today’s question</label><select id="promptChoice" onchange="changePrompt(this.value)">${reflections.map((r,i)=>`<option value="${i}" ${i===idx?'selected':''}>${esc(r[0])}</option>`).join('')}</select></div><div class="reflectionprompt">${esc(reflections[idx][1])}</div><div class="field"><label>Your reflection</label><textarea id="reflectionText" style="min-height:180px" placeholder="Write freely. A few honest lines are enough.">${esc(entry.text)}</textarea></div><div class="field"><label>Optional: one thing I want to remember</label><input id="reflectionExtra" value="${esc(entry.extra||'')}" placeholder="A moment, insight or intention"></div>${button('Save reflection','saveReflection()')} <span class="muted small" id="savedAt">${entry.updated?'Saved '+new Date(entry.updated).toLocaleTimeString():''}</span>`)}
 ${card(`${header('Past reflections')}<p class="muted">Browse saved entries. Your reflections remain in this browser until you export a backup.</p>${Object.keys(state.reflections).sort().reverse().slice(0,12).map(d=>`<div class="item row between"><div><strong>${esc(d)}</strong><p>${esc((state.reflections[d].text||'No text').slice(0,90))}</p></div>${button('Open',`reflectionDate='${d}';render()`,'btn secondary smallbtn')}</div>`).join('')||'<div class="empty">Your first reflection will appear here.</div>'}`)}</div></div>`}
function changePrompt(v){const e=state.reflections[reflectionDate]||{};e.promptIndex=Number(v);state.reflections[reflectionDate]=e;persist();render()}
function saveReflection(){state.reflections[reflectionDate]={...(state.reflections[reflectionDate]||{}),promptIndex:Number(document.getElementById('promptChoice').value),text:document.getElementById('reflectionText').value,extra:document.getElementById('reflectionExtra').value,updated:new Date().toISOString()};persist();render();toast('Reflection saved')}
function renderReviews(root){root.innerHTML=`<section class="hero"><div class="eyebrow">Step back to see the pattern</div><h1>Review your direction, not just your output.</h1><p>Use reviews to adjust the system and protect the life you are trying to build.</p></section><div class="layout"><div class="stack">${card(`${header('Review rhythm')}<div class="tabs">${[['weekly','Weekly'],['monthly','Monthly'],['quarterly','Quarterly']].map(([v,l])=>`<button class="${reviewType===v?'active':''}" onclick="reviewType='${v}';render()">${l}</button>`).join('')}</div>${reviewForm()}`)}</div><div class="stack">${card(`${header('Previous reviews')}${Object.entries(state.reviews[reviewType]||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,10).map(([d,e])=>`<div class="item"><strong>${esc(d)}</strong><p>${esc((e.answers||[]).filter(Boolean).join(' · ').slice(0,160))}</p>${button('Open',`loadReview('${d}')`,'btn secondary smallbtn')}</div>`).join('')||'<div class="empty">Saved reviews will appear here.</div>'}`)}</div></div>`}
function reviewQuestions(){if(reviewType==='weekly')return ['What moved the primary project forward?','What did reality teach me?','What should I stop doing?','What deserves attention next week?','Is my active workload realistic?','Did I make room for health, inner practice, community, nature and relationships?'];if(reviewType==='monthly')return ['Where did my time actually go?','What gave me energy, and what drained it?','What moved financial freedom forward?','How did I contribute through service or community?','Did I make room for nature, organic farming or practical skills?','What did I do around teaching, education or meaningful learning?','How were health and inner growth?','Which life area am I neglecting?','What is one adjustment for next month?'];return ['What did I intend to achieve this quarter, and what actually happened?','Which outcome mattered most?','What did I learn about my energy, constraints and motivation?','Which goals still align with the life I want?','What should I continue, stop, or scale?','What must I release to make room for the next quarter?']}
function reviewForm(){let d=today().slice(0,7);if(reviewType==='weekly')d=today();if(reviewType==='quarterly')d=today().slice(0,4)+'-Q'+(Math.floor(new Date().getMonth()/3)+1);let entry=state.reviews[reviewType][d]||{answers:[]};return `<div class="field"><label>Review period</label><input id="reviewKey" value="${esc(d)}"></div>${reviewQuestions().map((q,i)=>`<div class="field"><label>${i+1}. ${esc(q)}</label><textarea id="review${i}">${esc(entry.answers[i]||'')}</textarea></div>`).join('')}${button('Save review',`saveReview(${reviewQuestions().length})`)}`}
function saveReview(n){const d=document.getElementById('reviewKey').value;state.reviews[reviewType][d]={answers:Array.from({length:n},(_,i)=>document.getElementById('review'+i).value),updated:new Date().toISOString()};persist();render();toast('Review saved')}
function loadReview(d){const e=state.reviews[reviewType][d];if(!e)return;const n=reviewQuestions().length;document.getElementById('reviewKey').value=d;for(let i=0;i<n;i++){let el=document.getElementById('review'+i);if(el)el.value=e.answers[i]||''}}
function renderIdeas(root){
 const list=[...state.ideas].sort((a,b)=>(b.created||'').localeCompare(a.created||''));
 root.innerHTML=`<section class="hero"><div class="eyebrow">Capture now. Decide later.</div><h1>Your Idea Garden</h1><p>A quiet place to catch ideas before they disappear. No scoring, deadlines or pressure to act on them.</p></section>
 <section class="card"><div class="cardhead"><h2><span class="idea-mark">✧</span>Capture an idea</h2></div><div class="field"><label>Idea</label><input id="ideaTitle" placeholder="A few words to remember it"></div><div class="field"><label>Optional note</label><textarea id="ideaNote" placeholder="Context, a question, or where it came from" rows="2"></textarea></div>${button('Save idea','addIdea()')}</section>
 <section class="card"><div class="cardhead"><h2>Collected ideas</h2><span class="muted">${list.length} saved</span></div>${list.length?list.map(i=>`<div class="idea-row"><div class="idea-mark">✧</div><div style="flex:1"><strong>${esc(i.title)}</strong><div class="muted small">${esc(new Date(i.created).toLocaleDateString())}</div>${i.note?`<p>${esc(i.note)}</p>`:''}</div><div class="actions">${button('Edit',`editIdea('${i.id}')`,'btn secondary smallbtn')}${button('Delete',`deleteIdea('${i.id}')`,'btn ghost smallbtn')}</div></div>`).join(''):'<p class="muted">No ideas captured yet. Add one whenever something occurs to you.</p>'}</section>`;
}
function addIdea(){const title=document.getElementById('ideaTitle').value.trim();if(!title){toast('Add a short idea first');return}state.ideas.push({id:id(),title,note:document.getElementById('ideaNote').value.trim(),created:new Date().toISOString()});persist();render();toast('Idea saved')}
function editIdea(ideaId){const i=state.ideas.find(x=>x.id===ideaId);if(!i)return;const title=prompt('Edit idea',i.title);if(title===null)return;if(!title.trim()){toast('Idea title cannot be empty');return}const note=prompt('Edit note (optional)',i.note||'');if(note===null)return;i.title=title.trim();i.note=note.trim();persist();render();toast('Idea updated')}
function deleteIdea(ideaId){if(!confirm('Delete this idea?'))return;state.ideas=state.ideas.filter(x=>x.id!==ideaId);persist();render();toast('Idea deleted')}
function renderSettings(root){
 root.innerHTML=`<section class="hero"><div class="eyebrow">Your data, your choice</div><h1>Keep your system portable.</h1><p>Data is stored locally in this browser. Export a backup to move it to another device or restore it later.</p></section><div class="layout"><div class="stack">
 <section class="card"><div class="cardhead"><h2>Guiding vision</h2></div><div class="field"><label>Your north star</label><textarea id="vision" style="min-height:140px">${esc(state.vision)}</textarea></div>${button('Save vision','saveVision()')}<hr class="divider"><h3>Daily foundations</h3>${state.habits.map((h,i)=>`<div class="field"><label>Practice ${i+1} — name</label><input id="habit${i}" value="${esc(h)}"><label style="margin-top:6px">Description shown on Today page</label><input id="habitDescription${i}" value="${esc(state.habitDescriptions[i]||'')}"></div>`).join('')}${button('Save practice names & descriptions','saveHabits()')}</section>
 <section class="card"><div class="cardhead"><h2>Data backup</h2></div><p class="muted">Export includes goals, assessment answers, plans, habits, reflections and reviews. Keep the backup somewhere private.</p><div class="row" style="flex-wrap:wrap">${button('Export backup (JSON)','exportData()')}${button('Restore backup','document.getElementById("restoreFile").click()','btn secondary')}</div><input class="hidden" type="file" id="restoreFile" accept=".json,application/json" onchange="importData(this.files[0])"><p class="muted small">Last backup: ${state.settings.lastBackup?esc(new Date(state.settings.lastBackup).toLocaleString()):'Not recorded yet'}</p><div class="notice">Browser-local storage does not automatically sync across devices. Export from one device and restore on the other. Do not store confidential clinical or work information here.</div></section>
 </div><div class="stack"><section class="card"><div class="cardhead"><h2>Install on your device</h2></div><p>When hosted over HTTPS, use your browser’s menu and choose <strong>Install app</strong> or <strong>Add to Home screen</strong> if offered.</p><p class="muted small">This folder includes a PWA manifest and service worker. Offline and installation support depends on the host and browser.</p></section>
 <section class="card"><div class="cardhead"><h2>Data controls</h2></div><p>Use export backups regularly. Clearing browser data can erase local entries.</p>${button('Delete all app data','resetData()','btn danger')}</section></div></div>`;
}
function saveVision(){state.vision=document.getElementById('vision').value;persist();toast('Vision saved');render()}
function saveHabits(){state.habits=state.habits.map((_,i)=>document.getElementById('habit'+i).value.trim()||habits[i]);state.habitDescriptions=state.habits.map((_,i)=>document.getElementById('habitDescription'+i).value.trim());persist();toast('Practice names and descriptions saved');render()}
function exportData(){state.settings.lastBackup=new Date().toISOString();persist();const blob=new Blob([JSON.stringify({app:'North Star',version:1,exportedAt:state.settings.lastBackup,data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='north-star-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);render();toast('Backup exported')}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result),d=obj.data||obj;if(!d.goals||!d.daily||!d.reflections)throw Error('This does not look like a North Star backup.');if(!confirm('Restore this backup? Current data in this browser will be replaced.'))return;state=d;persist();render();toast('Backup restored')}catch(e){alert('Could not restore backup: '+e.message)}};r.readAsText(file)}
function resetData(){if(!confirm('Delete all North Star data from this browser? Export a backup first if you want to keep it.'))return;state=fresh();persist();go('Today');toast('App data reset')}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
renderNav();render();
</script></body></html>
